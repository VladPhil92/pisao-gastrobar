name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run production smoke certification
        env:
          PISAO_PRODUCTION_URL: https://pisaogastrobar.com
          PISAO_SMOKE_TIMEOUT_MS: 12000
        run: node scripts/test-production-smoke.mjs
