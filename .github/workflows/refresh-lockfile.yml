name: Refresh dependency lockfile

on:
  push:
    branches:
      - feat/ctgone-federated-customer-access-v1
    paths:
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ctgone-federated-customer-access-v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh package lock against patched production versions
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): refresh lockfile after security upgrades"
            git push origin HEAD:feat/ctgone-federated-customer-access-v1
          fi
