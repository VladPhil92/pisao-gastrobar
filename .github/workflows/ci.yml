name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block critical production advisories
        run: npm audit --omit=dev --audit-level=critical

      - name: Trace high-severity audit paths
        run: |
          npm audit --omit=dev --audit-level=high || true
          npm ls --omit=dev --all prisma @prisma/config @prisma/dev mysql2 deepmerge-ts fast-uri nanoid hono @hono/node-server baseline-browser-mapping || true

      - name: Generate image manifest
        run: npm run images:optimize

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
