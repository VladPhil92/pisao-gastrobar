name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify release manifest integrity
        run: node scripts/verify-release-integrity.mjs

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Verify hardened dependency tree
        run: npm ls --all prisma @prisma/config @prisma/dev mysql2 deepmerge-ts fast-uri nanoid hono @hono/node-server baseline-browser-mapping brace-expansion browserslist js-yaml

      - name: Prisma CLI compatibility
        run: npx prisma validate

      - name: Generate image manifest
        run: npm run images:optimize

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Reservation engine tests
        run: npm run test:reservations

      - name: Concierge hospitality tests
        run: npm run test:concierge

      - name: Concierge action runtime tests
        run: npm run test:actions

      - name: Concierge stateful tool tests
        run: npm run test:tools

      - name: Concierge native tool tests
        run: npm run test:native-tools

      - name: Edge security tests
        run: npm run test:security

      - name: Revenue attribution tests
        run: npm run test:revenue

      - name: Revenue action engine tests
        run: npm run test:revenue-actions

      - name: Revenue experimentation tests
        run: npm run test:revenue-experiments

      - name: Adaptive revenue policy tests
        run: npm run test:revenue-policies

      - name: Contextual commerce V18 tests
        run: npm run test:contextual-commerce

      - name: Contextual learning V19 tests
        run: npm run test:contextual-learning

      - name: Profit and inventory guardrail tests
        run: npm run test:profit

      - name: Recipe and inventory intelligence tests
        run: npm run test:inventory

      - name: Payment integrity tests
        run: npm run test:payments

      - name: Customer order tracking tests
        run: npm run test:tracking

      - name: Commercial end-to-end certification
        run: npm run test:commercial-e2e

      - name: WhatsApp coexistence tests
        run: npm run test:whatsapp

      - name: WhatsApp Embedded Signup config tests
        run: npm run test:whatsapp-config

      - name: WhatsApp production activation tests
        run: npm run test:whatsapp-activation

      - name: WhatsApp operations tests
        run: npm run test:whatsapp-operations

      - name: WhatsApp Meta onboarding tests
        run: npm run test:whatsapp-meta-onboarding

      - name: Meta compliance readiness tests
        run: npm run test:meta-compliance

      - name: Meta App Review evidence tests
        run: npm run test:meta-app-review

      - name: Meta automated review evidence tests
        run: npm run test:meta-review-evidence

      - name: Owner Governance and IAM tests
        run: npm run test:owner-governance

      - name: Customer CRM and Loyalty tests
        run: npm run test:crm-loyalty

      - name: Production certification tests
        run: npm run test:certification

      - name: CTG One admin SSO tests
        run: npm run test:ctgone-auth

      - name: Production build
        run: npm run build
