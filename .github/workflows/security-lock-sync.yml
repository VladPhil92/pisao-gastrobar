name: Security lock sync

on:
  push:
    branches:
      - security/dependency-hardening-v1

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-hardening-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply compatible audit remediations
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify dependency audit is clean
        run: npm audit --audit-level=low

      - name: Verify production dependency audit is clean
        run: npm audit --omit=dev --audit-level=low

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(security): refresh dependency lock [lock-sync]"
          git push origin HEAD:security/dependency-hardening-v1
